[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faq-quantum-mapper"
version = "0.2.0"
authors = [
  { name="Karthik G", email="karthik@example.com" },
]
description = "FAQ-Layout: Quadratic Assignment Pre-Placement for Quantum Routing"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Quantum Computing",
]
dependencies = [
    "qiskit>=1.0.0",
    "pytket>=1.25.0",
    "pytket-qiskit>=0.48.0",
    "mqt.qmap>=2.5.0",
    "mqt.bench>=1.0.0",
    "networkx>=3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.16.6",
]

[tool.setuptools.packages.find]
include = ["qap_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["historical", ".venv", ".uv-cache", ".uv-python", "build", "dist"]

[tool.ruff.lint]
# Focus on correctness and real cleanliness (unused imports/vars, syntax,
# ambiguous names, import order). Deliberately omits churn-heavy rules such as
# pyupgrade/annotation modernization.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The benchmark runners insert the repo root into sys.path before importing the
# qap_compiler package (they are standalone scripts under benchmarks/).
"benchmarks/*.py" = ["E402"]
